# IBM Db2 Community Edition (free, no card). Needs Docker and about 4 GB RAM.
services:
  db2:
    image: icr.io/db2_community/db2
    container_name: herbcheck-db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2INST1_PASSWORD:?set DB2INST1_PASSWORD in .env}
      DBNAME: herbdb
    volumes:
      - db2data:/database
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to herbdb' > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 40
      start_period: 120s
volumes:
  db2data:
